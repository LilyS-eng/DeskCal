name: Pure WPF Acrylic diagnostic
on:
  push:
    branches: [diagnostic/acrylic-no-webview2]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: windows-2025
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: dotnet build Windows/DeskCal.csproj -c Release
      - name: Check package and managed references
        shell: powershell
        run: |
          $dir = 'Windows/bin/Release/net48'
          $app = [Reflection.Assembly]::ReflectionOnlyLoadFrom((Resolve-Path "$dir/DeskCal.WpfDiagnostic.exe"))
          if ($app.GetReferencedAssemblies().Name -match 'WebView2') { throw 'Browser assembly reference' }
          if (Get-ChildItem $dir -Recurse | Where-Object { $_.Name -match 'WebView2|index.html' }) { throw 'Unexpected web payload' }
      - name: Exercise the x64 entry point and verify the log
        run: python tests/windows/test_desktop.py tests/windows/pure_wpf_smoke.py Windows/bin/Release/net48/DeskCal.WpfDiagnostic.exe
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DeskCal-Diagnostic-NoWebView2-x64
          path: Windows/bin/Release/net48/
