name: Windows widget input
on:
  push:
    branches: [windows-1.0.3]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-11-arm, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build x64 widget
        run: dotnet build Windows/DeskCal.csproj -c Release
      - name: Ensure Evergreen WebView2 Runtime is available
        shell: pwsh
        run: |
          $edge = "${env:ProgramFiles(x86)}\Microsoft\EdgeWebView\Application"
          if (!(Test-Path "$edge\*\msedgewebview2.exe")) {
            $installer = Join-Path $env:RUNNER_TEMP 'MicrosoftEdgeWebview2Setup.exe'
            Invoke-WebRequest 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -OutFile $installer
            if ((Get-AuthenticodeSignature $installer).Status -ne 'Valid') { throw 'Invalid runtime installer signature' }
            $p = Start-Process $installer -ArgumentList '/silent','/install' -Wait -PassThru
            Write-Host "Evergreen bootstrapper exit $($p.ExitCode)"
          }
          Get-ChildItem "$edge\*\msedgewebview2.exe" | Select-Object -ExpandProperty FullName
      - name: Exercise real window input
        shell: pwsh
        run: |
          if ($env:RUNNER_ARCH -eq 'ARM64') {
            python tests/windows/test_desktop.py Windows/tests/input_smoke.py Windows/bin/Release/net48/DeskCal.exe
          } else {
            python Windows/tests/input_smoke.py Windows/bin/Release/net48/DeskCal.exe
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DeskCal-1.0.3-x64-${{ matrix.os }}
          path: Windows/bin/Release/net48/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Calendar-preview-${{ matrix.os }}
          path: ${{ runner.temp }}/DeskCal.png
          if-no-files-found: ignore
